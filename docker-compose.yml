services:
  commander:
    build: .
    ports: ["8000:8000"]
    environment:
      AGENTOPS_DB_PATH: /data/agentops.db
      AGENTOPS_DEMO_MODE: "true"
    volumes: ["commander-data:/data"]
    depends_on:
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agentops
      POSTGRES_USER: agentops
      POSTGRES_PASSWORD: demo-only-password
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U agentops"], interval: 5s, timeout: 3s, retries: 10}
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10}
  prometheus:
    image: prom/prometheus:v2.54.1
    volumes: ["./deploy/docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana:11.2.0
    environment: {GF_SECURITY_ADMIN_PASSWORD: demo-admin}
    ports: ["3000:3000"]
    depends_on: [prometheus]
volumes:
  commander-data:
  postgres-data:

