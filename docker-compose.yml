services:
  commander:
    build: .
    ports: ["${AGENTOPS_PORT:-8000}:8000"]
    environment:
      DATABASE_URL: postgresql://agentops:demo-only-password@postgres:5432/agentops
      AGENTOPS_DEMO_MODE: "true"
      AGENTOPS_RUNTIME_MODE: ${AGENTOPS_RUNTIME_MODE:-auto}
      AGENTOPS_PLANNER_MODEL: ${AGENTOPS_PLANNER_MODEL:-gpt-5.6-terra}
      AGENTOPS_REPORTER_MODEL: ${AGENTOPS_REPORTER_MODEL:-gpt-5.6-luna}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agentops
      POSTGRES_USER: agentops
      POSTGRES_PASSWORD: demo-only-password
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U agentops"], interval: 5s, timeout: 3s, retries: 10}
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10}
  prometheus:
    image: prom/prometheus:v2.54.1
    volumes: ["./deploy/docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["${AGENTOPS_PROMETHEUS_PORT:-9090}:9090"]
  grafana:
    image: grafana/grafana:11.2.0
    environment: {GF_SECURITY_ADMIN_PASSWORD: demo-admin}
    ports: ["${AGENTOPS_GRAFANA_PORT:-3000}:3000"]
    depends_on: [prometheus]
volumes:
  postgres-data:
