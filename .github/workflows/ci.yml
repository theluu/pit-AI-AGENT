name: CI
on: [push, pull_request]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q
      - run: docker build -t agentops-commander:test .
      - uses: aquasecurity/trivy-action@master
        with: {image-ref: "agentops-commander:test", format: table, exit-code: "1", severity: "CRITICAL,HIGH"}
